name: Larimar CI/CD

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: larimar-linux-x86_64.tar.gz
            script_type: sh
          - os: ubuntu-24.04-arm          # ARM64: Raspberry Pi 4/5, ARM servers
            artifact_name: larimar-linux-arm64.tar.gz
            script_type: sh
          - os: macos-latest              # Apple Silicon
            artifact_name: larimar-macos-arm64.tar.gz
            script_type: sh
          - os: macos-13                  # Intel
            artifact_name: larimar-macos-x86_64.tar.gz
            script_type: sh
          - os: windows-latest
            artifact_name: larimar-windows-x86_64.zip
            script_type: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Compilación y verificación en Linux / macOS
      - name: Build and Verify (Unix)
        if: matrix.script_type == 'sh'
        run: |
          ./bootstrap/build.sh --verify

      # 2. Compilación y verificación en Windows (con MinGW/GCC)
      - name: Setup MinGW & Build (Windows)
        if: matrix.script_type == 'pwsh'
        shell: pwsh
        run: |
          choco install mingw -y
          $env:Path += ";C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"
          $env:CC = "gcc"
          $env:CFLAGS = "-std=c99 -O2"
          
          .\bootstrap\build.ps1 -verify

      # 3. El tcc incluido (Linux y Windows): toolchain/tcc dentro de ../out/larimar
      - name: Bundled tcc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-dev
          sh tools/tcc/build.sh ../out/larimar

      - name: Bundled tcc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path += ";C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"
          .\tools\tcc\build.ps1 ..\out\larimar

      # 4. Lo instalado funciona: un archivo suelto (con el tcc incluido en Linux y Windows) y un programa con hilos
      - name: Smoke test (Unix)
        if: matrix.script_type == 'sh'
        run: |
          expected="$(printf '%s\n%s' '0.1 0.30000000000000004 2.0 100.0 1234567.0 1e+20 1e-05 0.0001 -0.0' '0.3333333333333333 nan inf -inf 1.5 true')"
          out="$(../out/larimar/bin/larimar tests/cases/language/float_text.lar)"
          [ "$out" = "$expected" ] || { printf 'expected:\n%s\ngot:\n%s\n' "$expected" "$out"; exit 1; }
          ../out/larimar/bin/larimar tests/cases/language/sync_wait_until.lar

      - name: Smoke test (Windows)
        if: matrix.script_type == 'pwsh'
        shell: pwsh
        run: |
          $expected = @('0.1 0.30000000000000004 2.0 100.0 1234567.0 1e+20 1e-05 0.0001 -0.0', '0.3333333333333333 nan inf -inf 1.5 true') -join "`n"
          $out = (& ..\out\larimar\bin\larimar.cmd tests\cases\language\float_text.lar) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $out -ne $expected) { throw "expected:`n$expected`ngot:`n$out" }
          & ..\out\larimar\bin\larimar.cmd tests\cases\language\sync_wait_until.lar
          if ($LASTEXITCODE -ne 0) { throw "sync_wait_until failed" }

      # 5. Empaquetar el contenido de ../out/larimar
      - name: Package Larimar Directory (Unix)
        if: matrix.script_type == 'sh'
        run: |
          tar -czf ${{ matrix.artifact_name }} -C ../out larimar

      - name: Package Larimar Directory (Windows)
        if: matrix.script_type == 'pwsh'
        shell: pwsh
        run: |
          Compress-Archive -Path "..\out\larimar" -DestinationPath "${{ matrix.artifact_name }}" -Force

      # 6. Subir artefacto para el job de release
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    # 🔑 Permiso necesario para que el token automático cree la release y suba los assets
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p final-release
          find downloaded-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} final-release/ \;
          # install.sh and install.ps1 check each download against this list
          (cd final-release && sha256sum *.tar.gz *.zip > SHA256SUMS)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            final-release/*
          generate_release_notes: true